services:
  # Base de Datos
  postgres:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    # Variables de Entorno de la DB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orion-network

  # Backend de Orion
  orion-backend:
    build:
      context: ./
      args:
        PORT_ORION_BACKEND: ${PORT_ORION_BACKEND}
    container_name: orion-backend
    ports:
      - "${PORT_ORION_BACKEND}:${PORT_ORION_BACKEND}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
    networks:
      - orion-network

volumes:
  postgres_data:

# Red interna para conectar el Backend con la DB
networks:
  orion-network:
    driver: bridge